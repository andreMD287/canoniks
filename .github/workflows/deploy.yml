name: Desplegar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Deja terminar un despliegue en curso antes de empezar otro.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    name: Construir
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          # activa Pages la primera vez, sin tocar los ajustes a mano
          enablement: true

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar
        run: npm run build

      - name: Subir el sitio compilado
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  desplegar:
    name: Desplegar
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: despliegue
        uses: actions/deploy-pages@v4
